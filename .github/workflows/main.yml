
name: Build iPhone Savings Widget APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o iPhoneSavingsWidget-project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          find project -name gradlew -exec chmod +x {} \;
          cd "$(dirname "$(find project -name gradlew | head -n 1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneSavingsWidget-APK
          path: project/**/build/outputs/apk/debug/*.apk
